<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CCW Lab · Label</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --fg: #ebebeb; --dim: #8a8a8a; --out: cubic-bezier(.22,1,.36,1); }
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; color: var(--fg); font: 14px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
  header { width: 100%; display: flex; justify-content: space-between; align-items: center; height: 56px; padding: 0 32px; color: var(--dim); }
  header a { color: var(--dim); text-decoration: none; background: #111; border-radius: 999px; height: 36px; padding: 0 16px; display: inline-flex; align-items: center; }
  header a:hover { color: var(--fg); }
  .line { position: absolute; top: calc(100% + 56px); left: -40px; right: -40px; text-align: center; color: #bdbdbd; font-size: 12px; line-height: 1.45; }
  header b { color: var(--fg); font-weight: 400; }
  .bar { width: 220px; height: 2px; background: #222; }
  .bar i { display: block; height: 100%; background: var(--fg); width: 0; transition: width .3s var(--out); }
  main { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; width: 100%; }
  .card { position: absolute; height: min(60vh, 600px); aspect-ratio: 1288 / 1600; background: #111 center / cover no-repeat;
    box-shadow: 0 20px 60px rgba(0,0,0,.8); transition: transform .45s var(--out), opacity .45s var(--out); }
  .card.out { opacity: 0; }
  .meta { position: absolute; bottom: -46px; left: 0; right: 0; text-align: center; color: var(--dim); font-size: 12px; }
  .meta b { color: var(--fg); font-weight: 400; }
  .stamp { position: absolute; top: 18px; left: 50%; translate: -50% 0; padding: 4px 12px; border: 2px solid var(--fg); border-radius: 4px;
    font-size: 20px; letter-spacing: .04em; background: rgba(0,0,0,.6); opacity: 0; transition: opacity .15s; }
  .card.stamped .stamp { opacity: 1; }
  footer { display: flex; gap: 8px; padding: 110px 0 28px; }
  footer button { background: #111; color: var(--fg); border: 1px solid #2a2a2a; border-radius: 999px; padding: 10px 16px; font: inherit; cursor: pointer;
    transition: background .2s, border-color .2s; }
  footer button:hover, footer button.hint { border-color: #777; }
  footer button.hit { background: var(--fg); color: #000; }
  footer kbd { color: var(--dim); margin-right: 6px; font: inherit; }
  footer button.hit kbd { color: #444; }
  .help { color: #555; font-size: 12px; padding-bottom: 14px; }
  .done { position: absolute; text-align: center; color: var(--dim); }
  .done b { display: block; color: var(--fg); font-size: 22px; font-weight: 400; margin-bottom: 8px; }
</style>
</head>
<body>
<header>
  <div style="display:flex;gap:14px;align-items:center"><a href="/">Map</a><span><b>People</b> · who is on the cover?</span></div>
  <div style="display:flex;gap:14px;align-items:center"><span id="prog">0 / 100</span><div class="bar"><i id="barI"></i></div><span id="tot"></span></div>
</header>
<main id="stage"></main>
<footer id="btns"></footer>
<div class="help">1 None · 2 No face (back view, hands only) · 3 One · 4 Two · 5 Three or more · 6 Ambiguous (statue, mask, shadow) · ← undo · space skip · the description's guess is outlined</div>
<script>
// People v2 범주. 키 번호는 Lab 지도의 범례 번호와 같다(Edit 모드)
const CH = [
  ['None', 'None', '1', 'Digit1'], ['No-face', 'No face', '2', 'Digit2'], ['One', 'One', '3', 'Digit3'],
  ['Two', 'Two', '4', 'Digit4'], ['3+', 'Three or more', '5', 'Digit5'], ['Ambiguous', 'Ambiguous', '6', 'Digit6'],
];
const BATCH = 100;
let Q = [], k = 0, hist = [], total = 0;
const stage = document.getElementById('stage'), btns = document.getElementById('btns');
CH.forEach(([id, name], n) => {
  const b = document.createElement('button'); b.dataset.id = id;
  b.innerHTML = `<kbd>${CH[n][2]}</kbd>${name}`; b.onclick = () => choose(id); btns.appendChild(b);
});
const enc = f => encodeURIComponent(f);
// 카드 쌓기: 맨 앞 카드가 날아가면 뒤 카드가 그대로 앞으로 올라오고, 맨 뒤에 새 카드가 붙는다(화면을 통째로 다시 그리지 않는다)
const cards = new Map();   // 파일 → 카드
function pose(c, z) {
  c.style.transform = `translateY(${z * 10}px) scale(${1 - z * .04})`; c.style.zIndex = 10 - z; c.style.opacity = z ? .35 : 1;
  c.querySelector('.meta').style.visibility = z ? 'hidden' : 'visible';   // 글자는 맨 앞 카드만
  c.querySelector('.line').style.visibility = z ? 'hidden' : 'visible';
}
function makeCard(item) {
  const c = document.createElement('div'); c.className = 'card'; c._item = item;
  c.style.backgroundImage = `url("large/${enc(item.file)}")`;
  c.innerHTML = `<div class="stamp"></div><div class="meta"><b>#${item.spine}</b> · description: ${item.model || '—'}${item.old && item.old !== item.model ? ' · old label: ' + item.old : ''}</div><div class="line">${item.line || ''}</div>`;
  c.style.opacity = 0; c.style.transform = 'translateY(30px) scale(.88)';
  stage.prepend(c);                       // 뒤에 붙인다
  return c;
}
function render() {
  const end = Math.min(Q.length, BATCH);
  stage.querySelector('.done')?.remove();
  const want = Q.slice(k, Math.min(k + 3, end));
  for (const [f, c] of cards) if (!want.some(it => it.file === f) && !c.classList.contains('leaving')) { c.remove(); cards.delete(f); }
  want.forEach(it => { if (!cards.has(it.file)) cards.set(it.file, makeCard(it)); });
  requestAnimationFrame(() => want.forEach((it, z) => pose(cards.get(it.file), z)));
  if (k >= end) {
    const d = document.createElement('div'); d.className = 'done';
    d.innerHTML = `<b>${k} labeled</b>${Q.length - k > 0 ? 'press enter for the next 100' : 'all covers labeled'}`;
    stage.appendChild(d);
  } else {
    const g = Q[k].model;
    btns.querySelectorAll('button').forEach(b => b.classList.toggle('hint', b.dataset.id === g));
  }
  document.getElementById('prog').textContent = `${k} / ${end}`;
  document.getElementById('barI').style.width = `${k / Math.max(1, end) * 100}%`;
  document.getElementById('tot').textContent = `${total} total`;
  [3, 4].forEach(z => { if (Q[k + z]) new Image().src = `large/${enc(Q[k + z].file)}`; });   // 다음 장 미리 받기
}
async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return r.json();
}
// 고르면: 맨 앞 카드(지금 보이는 그 포스터)에 답을 저장하고, 도장이 찍힌 채 선택지 쪽으로 날아간다
function choose(id) {
  if (k >= Math.min(Q.length, BATCH)) return;
  const item = Q[k], top = cards.get(item.file);
  const n = CH.findIndex(c => c[0] === id), b = btns.querySelector(`[data-id="${id}"]`);
  b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 220);
  post('/api/label', { scheme: 'People', file: item.file, cat: id }).then(r => { total = r.done; document.getElementById('tot').textContent = `${total} total`; });
  hist.push(item); k++;
  if (top) {
    cards.delete(item.file); top.classList.add('leaving');
    top.querySelector('.stamp').textContent = CH[n][1]; top.classList.add('stamped'); top.style.zIndex = 20;
    const dx = (n - 2.5) * 140;   // 버튼 순서 쪽으로 날아간다
    top.style.transform = `translate(${dx}px, 60px) rotate(${(n - 2.5) * 4}deg) scale(.9)`; top.style.opacity = 0;
    setTimeout(() => top.remove(), 450);
  }
  render();
}
function undo() {
  if (!hist.length) return;
  const item = hist.pop(); k--;
  post('/api/undo', { scheme: 'People', file: item.file }).then(r => { total = r.done; render(); });
  render();
}
function skip() { if (k < Q.length) { const it = Q.splice(k, 1)[0]; Q.push(it); cards.get(it.file)?.remove(); cards.delete(it.file); render(); } }
addEventListener('keydown', e => {
  const code = e.code.replace(/^Numpad(\d)$/, 'Digit$1'), hit = CH.find(c => c[3] === code);
  if (hit) { e.preventDefault(); choose(hit[0]); }
  else if (e.code === 'Backspace' || e.code === 'ArrowLeft') { e.preventDefault(); undo(); }
  else if (e.code === 'Space') { e.preventDefault(); skip(); }
  else if (e.code === 'Enter' && k >= BATCH) { load(); }
});
async function load() {
  const r = await (await fetch('/api/queue')).json();
  cards.forEach(c => c.remove()); cards.clear();
  Q = r.queue; k = 0; hist = []; total = r.done; render();
}
load();
</script>
</body>
</html>
