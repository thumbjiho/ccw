<style>
  /* 가변 글자 크기: 폰(390px)의 값과 1440px 의 값을 잇는 직선(clamp 로 위아래를 막는다). 구간마다 끊지 않는다 */
  :root { --t1: clamp(10px, 9.6px + .095vw, 11.5px); --t2: clamp(11px, 10.6px + .095vw, 12.5px);
    --t3: clamp(12px, 11.6px + .095vw, 13.5px); --t4: clamp(13px, 12.6px + .095vw, 14.5px);
    --t5s: clamp(18px, 16.5px + .38vw, 23px); --t5: clamp(22px, 19px + .76vw, 32px); --t6: clamp(24px, 20.3px + .95vw, 36px); }
  :root { --fg: #ebebeb; --dim: #8a8a8a; --line: #2a2a2a; --out: cubic-bezier(.22,1,.36,1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; overflow: hidden; }
  button { font: inherit; }

  /* 두 화면이 함께 쓰는 머리줄: 축 + 원본/흔적 */
  header { position: fixed; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center;
    gap: 14px; padding: 0 32px; z-index: 40; }   /* 크레딧(30)보다 위: 검색 결과·축 목록이 아래로 길게 내려와도 덮는다 */
  .group { position: relative; display: flex; gap: 2px; background: #111; border-radius: 999px; padding: 4px; }
  .group button { position: relative; z-index: 1; border: 0; background: transparent; color: var(--dim); font-size: var(--t3);
    height: 28px; padding: 0 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; transition: color .3s var(--out); }
  .group button:not(:disabled):not(.on):hover { color: var(--fg); }
  .group button.on { color: #000; }
  .group button:disabled { opacity: .3; cursor: default; }
  .group button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .group .sep { width: 1px; margin: 6px 4px; background: #333; }
  .pill { position: absolute; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 999px; background: var(--fg);
    transition: transform .45s var(--out), width .45s var(--out); pointer-events: none; }
  .count { font-size: var(--t2); color: var(--dim); margin-left: auto; transition: opacity .3s; }
  /* 눈: 누르면 기계가 본 흔적이 보인다 */
  .eye { width: 36px; height: 36px; border: 0; border-radius: 50%; background: #111; color: var(--dim); padding: 0;
    cursor: pointer; display: grid; place-items: center; transition: background .35s var(--out), color .35s var(--out); }
  .eye:hover { color: var(--fg); }
  .eye:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .eye svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; overflow: visible; }
  .eye .pupil { fill: currentColor; stroke: none; transform-origin: 12px 12px; transition: transform .45s var(--out); }
  .eye .rays { opacity: 0; transform-origin: 12px 12px; transform: scale(.6); transition: opacity .35s var(--out), transform .5s var(--out); }
  .eye[aria-pressed="true"] { background: var(--fg); color: #000; }
  .eye[aria-pressed="true"] .pupil { transform: scale(1.55); }
  .eye[aria-pressed="true"] .rays { opacity: 1; transform: none; }
  /* 검색: 평소엔 좁게, 포커스하면 넓어진다 */
  .search { position: relative; }
  /* 쓰지 않을 때는 돋보기만 있는 동그라미로 접힌다 */
  #q { width: 36px; height: 36px; border: 0; border-radius: 999px; background: #111; color: var(--fg); cursor: pointer;
    font: inherit; font-size: var(--t3); padding: 0 0 0 36px; outline: none; transition: width .45s var(--out), background .2s, padding .45s var(--out); }
  #q:hover { background: #1a1a1a; }
  #q::placeholder { color: transparent; transition: color .2s; }
  .search:focus-within #q::placeholder { color: #666; }
  .search .icon { position: absolute; left: 10px; top: 10px; width: 16px; height: 16px; pointer-events: none;
    fill: none; stroke: var(--dim); stroke-width: 1.8; stroke-linecap: round; transition: stroke .2s; }
  .search:hover .icon, .search:focus-within .icon { stroke: var(--fg); }
  #q::-webkit-search-cancel-button { display: none; }
  .search .clear { position: absolute; right: 6px; top: 6px; width: 24px; height: 24px; border: 0; border-radius: 50%;
    background: transparent; color: var(--dim); font-size: 16px; line-height: 24px; padding: 0; cursor: pointer;
    transition: color .2s, background .2s; }
  .search .clear:hover { color: var(--fg); background: #2a2a2a; }
  .search:not(.has):not(:focus-within) .clear { opacity: 0; pointer-events: none; }
  .search .clear { transition: color .2s, background .2s, opacity .2s; }
  #q::placeholder { color: #666; }
  #q:focus, .search.has #q { width: 280px; background: #1a1a1a; padding-right: 36px; cursor: text; }
  #results { position: absolute; right: 0; top: 44px; width: 340px; margin: 0; padding: 6px; list-style: none;
    background: #0e0e0e; border: 1px solid var(--line); border-radius: 14px; z-index: 40;
    opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .2s var(--out), transform .25s var(--out); }
  .search.open #results { opacity: 1; transform: none; pointer-events: auto; }
  #results li { display: flex; gap: 10px; align-items: center; padding: 6px; border-radius: 9px; cursor: pointer; }
  #results li.on { background: #1d1d1d; }
  #results img { width: 34px; height: 42px; object-fit: cover; flex: none; background: #222; }
  #results .t { font-size: var(--t3); }
  #results .s { font-size: var(--t1); color: var(--dim); }
  #results .none { height: 120px; display: flex; align-items: center; justify-content: center; text-align: center;
    color: var(--dim); font-size: var(--t3); cursor: default; }
  /* 닫기는 세 폭 보기에서만. 숨어 있을 때는 폭을 접어 검색이 오른쪽 끝에 붙는다(줄이 맞게) */
  .close { border: 0; background: #111; color: var(--fg); width: 0; margin-left: -14px; height: 36px; border-radius: 50%;
    cursor: pointer; display: grid; place-items: center; padding: 0; opacity: 0; pointer-events: none; transform: scale(.6); overflow: hidden; flex: none;
    transition: opacity .3s var(--out), transform .4s var(--out), width .4s var(--out), margin .4s var(--out), background .2s; }
  body.tri-open .close { opacity: 1; pointer-events: auto; transform: none; width: 36px; margin-left: 0; }
  .close svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
  body.tri-open .close:hover { background: #222; transform: rotate(90deg); }
  body.tri-open .count { opacity: 0; }

  /* 격자: 캔버스 한 장 */
  #stage { position: fixed; top: 64px; left: 32px; right: 32px; bottom: 112px; }
  #grid { position: absolute; inset: 0; width: 100%; height: 100%; cursor: default; }
  #grid.hover { cursor: pointer; }
  .axis { position: absolute; font-size: var(--t1); color: var(--dim); white-space: nowrap; pointer-events: none;
    animation: fadeIn .6s var(--out) .45s both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  footer { position: fixed; left: 32px; bottom: 40px; right: 32px; pointer-events: none; }
  .k { font-size: var(--t3); color: var(--dim); }
  .v { font-size: var(--t6); margin-top: 2px; }

  #lens { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 9; opacity: 0;
    background-size: cover; background-position: center; outline: 1px solid var(--fg); box-shadow: 0 10px 30px rgba(0,0,0,.8);
    transition: opacity .25s var(--out), transform .34s var(--out), width .34s var(--out), height .34s var(--out); }
  #lens.show { opacity: 1; }
  #lens.jump { transition: none; }
  #tip { position: fixed; left: 0; top: 0; pointer-events: none; background: #111; border: 1px solid var(--line);
    padding: 10px 12px; font-size: var(--t2); line-height: 1.5; max-width: 280px; z-index: 10;
    opacity: 0; transform: translateY(6px); transition: opacity .18s var(--out), transform .18s var(--out); }
  #tip.show { opacity: 1; transform: none; }
  #tip b { font-size: var(--t4); font-weight: 500; }

  /* 화면 사이를 나는 이미지 한 장 */
  #flyer { position: fixed; left: 0; top: 0; z-index: 25; pointer-events: none; display: none;
    transform-origin: 0 0; background: #0b0b0b; overflow: hidden; }
  #flyer img, #flyer canvas, #flyer div { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* 세 폭 보기 */
  #tri { position: fixed; inset: 0; background: #000; z-index: 20; visibility: hidden; opacity: 0;
    transition: opacity .35s var(--out), visibility 0s .35s; }
  #tri.open { visibility: visible; opacity: 1; transition: opacity .35s var(--out), visibility 0s; }
  #tri footer { transform: translateY(14px); transition: transform .6s var(--out); }
  #tri.open footer { transform: none; }
  /* 위·아래: 다른 클러스터로 빠지는 출구, 가운데: 세 폭 */
  /* 간격은 가로세로 모두 --gap 하나 */
  #panels { --gap: 18px; position: absolute; top: 64px; bottom: 124px; left: 0; right: 0; display: grid;
    --edge: 54px; grid-template-columns: var(--bw) var(--bw) var(--bw) var(--bw);
    grid-template-rows: var(--edgeV, var(--edge)) var(--bh) var(--edgeV, var(--edge)); align-content: center;
    gap: var(--gap); justify-content: center;
    overflow: clip; }   /* 위·아래 띠에서 출발하는 커버는 영역 밖(맨 위·맨 아래 검은 띠) 뒤에서 나온다 */
  .box { position: relative; width: var(--bw); height: var(--bh); overflow: hidden; background: #0b0b0b;
    transform-origin: 0 0; cursor: pointer; grid-row: 2; }
  .box.side:hover { outline: 1px solid var(--dim); }
  .box.side img { transition: transform .5s var(--out); }
  .box.side:hover img { transform: scale(1.03); }
  .box.landing > * { visibility: hidden; }
  .box img, .box canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* 느린 회선: 큰 커버가 오기 전에는 이미 받은 작은 아틀라스 타일(흐린 커버)을 밑그림으로 깔고 숨 쉬듯 깜빡인다 */
  img.lq:not(.ok) { animation: lqp 1.1s ease-in-out infinite alternate; }
  @keyframes lqp { to { opacity: .55; } }
  .box canvas { pointer-events: none; opacity: 0; transition: opacity .5s var(--out); }
  body.trace .box canvas { opacity: 1; }
  /* 3번째 칸: 지금 커버의 상세 정보 */
  /* 정보 칸은 3열 전체(위 띠 ~ 아래 띠)를 차지하고, 위아래 padding 으로 평소엔 커버 높이만 쓴다.
     넘치면 fillInfo 가 padding 을 넘치는 만큼만 위아래 반씩 줄여 가운데를 중심으로 늘어난다 */
  .info { grid-row: 1 / 4; grid-column: 3; display: flex; flex-direction: column; gap: 6px; min-height: 0; overflow: hidden;
    padding: 0 4px 2px; font-size: var(--t4); line-height: 1.45; color: var(--dim);
    transition: padding-top .42s var(--out), padding-bottom .42s var(--out); }
  .info > * { flex: none; }
  /* 번호·제목·감독 줄은 커버 윗변에, 표와 링크(.body)는 아랫변에 붙인다. justify-content 로 나누면 넘친 높이를 잴 수 없다 */
  .info .body { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
  .info .no { font-size: var(--t3); margin-bottom: -2px; }
  .info .t { font-size: var(--t5); line-height: 1.12; color: var(--fg); margin-bottom: 10px; }
  .info.small .t { font-size: var(--t5s); }
  .info.tight .kv span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info .n { font-size: var(--t2); margin-top: 10px; display: flex; gap: 14px; align-items: baseline; }
  .info .o { margin-top: -2px; margin-bottom: 4px; font-style: italic; }   /* 제목과 한 묶음(.tt) */
  .info .sp { height: 10px; }
  .info .kv { display: grid; grid-template-columns: 7.5em 1fr; column-gap: 10px; font-size: var(--t3); line-height: 1.4; }
  .info .kv span:first-child { color: #555; }
  .info .kv span:last-child { color: #b5b5b5; }
  .info a { color: var(--dim); text-decoration: none; border-bottom: 1px solid #333; transition: color .2s, border-color .2s; }
  .info a:hover { color: var(--fg); border-color: var(--fg); }
  /* spine 번호가 criterion.com 링크(새 탭). 화살표는 Lucide arrow-up-right(24 격자의 7–17, viewBox 5–19)를
     글자의 절반 남짓 크기로, 대문자 높이(약 .72em)의 가운데에 맞춘다. 끝과 이음은 둥글게, 선은 약 1px */
  .info a.no { align-self: flex-start; color: var(--dim); border: 0; text-decoration: underline dotted transparent;
    text-decoration-thickness: 1px; text-underline-offset: .2em; transition: color .2s, text-decoration-color .2s; }
  .info a.no:hover, .info a.no:focus-visible { color: var(--fg); text-decoration-color: currentColor; outline: none; }
  .info a.no .out { opacity: .6; transition: opacity .2s; }
  .info a.no:hover .out, .info a.no:focus-visible .out { opacity: 1; }
  .info .no .out { width: .62em; height: .62em; margin-left: .3em; vertical-align: .05em; fill: none; stroke: currentColor;
    stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  /* 더보기: 덜 중요한 줄은 접어 둔다 */
  .info .extra { display: none; flex-direction: column; gap: 6px; overflow: hidden; }
  .info .m { font-size: var(--t2); margin-top: 2px; }
  .info.open .extra { display: flex; }
  .info.compact, .info.compact .body, .info.compact .extra { gap: 3px; }   /* 넘칠 때 마지막으로 줄 간격을 좁힌다 */
  .info.compact .kv { font-size: var(--t2); line-height: 1.35; }
  .info .more { border: 0; background: none; padding: 0; font: inherit; color: var(--dim); cursor: pointer;
    border-bottom: 1px solid #333; transition: color .2s, border-color .2s; }
  .info .more:hover { color: var(--fg); border-color: var(--fg); }
  .info .more:focus-visible { outline: 1px solid var(--fg); outline-offset: 3px; }
  /* 줄 이름: 가운데 줄 것만, 1열 왼쪽 여백에 세로로. 가운데 커버 윗변에서 시작해 아래 띠 끝까지 쓸 수 있다 */
  .rowname { grid-column: 1; grid-row: 2 / 4; position: relative; pointer-events: none; z-index: 2; }
  .rowname span { position: absolute; right: 100%; top: 0; margin-right: 9px; writing-mode: vertical-rl; transform: rotate(180deg);
    font-size: var(--t1); letter-spacing: .02em; white-space: nowrap; color: var(--dim);
    max-height: 100%; overflow: hidden; text-overflow: ellipsis; }
  /* 오른쪽 아래 만든 이 */
  /* 만든 이: 왼쪽 아래 축 이름 밑에 한 줄 */
  #credit2 { position: fixed; right: 32px; bottom: 16px; z-index: 30; font-size: var(--t1); line-height: 1.6; color: #4a4a4a; white-space: nowrap; text-align: right; }
  #credit { position: fixed; left: 32px; bottom: 16px; z-index: 30; font-size: var(--t1); color: #4a4a4a; white-space: nowrap; }
  #credit i, #credit2 i { font-style: normal; margin: 0 7px; color: #333; }
  #credit a, #credit2 a { color: #6a6a6a; text-decoration: none; transition: color .2s; }
  #credit a:hover, #credit2 a:hover { color: var(--fg); }
  #credit .ver { color: #3a3a3a; font-variant-numeric: tabular-nums; }
  .peek { position: relative; overflow: hidden; cursor: pointer; opacity: .38;
    transition: opacity .3s var(--out), transform .4s var(--out); }
  .peek[data-row="up"] { grid-row: 1; }
  .peek[data-row="mid"] { grid-row: 2; }
  .peek[data-row="down"] { grid-row: 3; }
  .peek:hover { opacity: 1; }
  .peek[data-row="up"]:hover { transform: translateY(-3px); }
  .peek[data-row="down"]:hover { transform: translateY(3px); }
  /* 띠 안의 포스터는 가운데 커버와 같은 크기(--bw × --bh)이고, 안쪽 가장자리에 붙어 잘린다. 비율은 그대로 */
  .peek img, .peek canvas { position: absolute; width: var(--bw, 100%); height: var(--bh, auto); object-fit: cover; left: 0; top: 0; }
  .peek[data-row="up"] img, .peek[data-row="up"] canvas { top: auto; bottom: 0; }
  .peek canvas { opacity: 0; transition: opacity .5s var(--out); pointer-events: none; }
  body.trace .peek canvas { opacity: 1; }

  /* 단축키 팝오버 */
  #kbd { position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none; display: flex; align-items: center; gap: 6px;
    padding: 5px 7px 5px 10px; background: #1a1a1a; border: 1px solid #2c2c2c; border-radius: 9px; font-size: var(--t1);
    color: var(--dim); white-space: nowrap; opacity: 0; transform: translateY(3px); transition: opacity .15s var(--out), transform .2s var(--out); }
  #kbd.show { opacity: 1; transform: none; }
  #kbd span { margin-right: 2px; }
  #kbd kbd { font: inherit; font-size: var(--t1); color: var(--fg); background: #2a2a2a; border-radius: 5px; padding: 1px 6px; min-width: 18px; text-align: center; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0s !important; transition-delay: 0s !important;
      animation-duration: 0s !important; animation-delay: 0s !important; }
  }
  /* 첫 로딩 */
  /* 자유 배치 이름표: 덩어리 위 가운데, 커버 위에 얹혀도 읽히게 */
  /* 줌 버튼: 격자 오른쪽 아래. 세 폭 보기에서는 숨긴다 */
  #zoom { position: fixed; right: 32px; bottom: 66px; z-index: 30; display: flex; flex-direction: row; gap: 2px; background: #111; border-radius: 999px; padding: 4px; transition: opacity .3s; }
  #zoom button { width: 28px; height: 28px; border: 0; border-radius: 50%; background: none; color: var(--dim); font-size: 17px; line-height: 1; cursor: pointer; padding: 0; }
  #zoom button:hover { background: #222; color: var(--fg); }
  body.tri-open #zoom { opacity: 0; pointer-events: none; }
  #stage { overflow: hidden; }
  html, body { touch-action: pan-x pan-y; }   /* 폰: 페이지 핀치·두 번 탭 확대 금지 */
  #hires { position: absolute; inset: 0; pointer-events: none; }
  /* 터치: 화면 정가운데 점. 점이 닿은 커버·클러스터에 호버 효과(확대했을 때만) */
  #reticle { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #ebebeb;
    box-shadow: 0 0 0 1.5px rgba(0,0,0,.6); pointer-events: none; z-index: 6; opacity: 0; scale: .4; transition: opacity .25s, scale .3s cubic-bezier(.22,1,.36,1); }
  body.touchmode #stage.zoomed #reticle { opacity: 1; scale: 1; }
  body.tri-open #reticle { opacity: 0 !important; }
  #hires img { position: absolute; left: 0; top: 0; object-fit: cover; opacity: 0; transition: opacity .25s; }
  #hires img.ok { opacity: 1; }
  #hires img.hov { outline: 1px solid #ebebeb; outline-offset: -1px; }
  #hires img { transition: opacity .25s, filter .3s; }
  #hires img.dim { filter: brightness(.4); }
  #stage.zoomed #grid { cursor: grab; }
  #grid.grabbing { cursor: grabbing !important; }
  /* 영역 네모(People 의 Couple): 평소엔 거의 보이지 않고, 호버하면 밝아지며 이름이 뜬다 */

<script>
/* ---------- 첫 로딩 ----------
   배포(http): data.js 와 반 크기 커버 아틀라스를 직접 받아 받은 양을 보여준다. 크기는 build_web.py 가 SIZES 에 적는다
   (brotli 로 오더라도 읽는 쪽은 풀린 바이트라 원래 크기와 비교한다). 다 받으면 본 스크립트(#main)를 실행한다.
   로컬(file://): fetch 를 못 써서 예전처럼 script 로 읽는다. ⌘⇧R(강한 새로고침) 때만 더미 진행을 보여준다 */
/* 빌드마다 바뀌는 값(data.js 크기)을 data.js 와 아틀라스 주소에 붙인다. 커버가 늘면 아틀라스 칸 순서가 바뀌는데,
   브라우저가 이전 아틀라스를 캐시에서 쓰면 칸마다 엉뚱한 커버가 그려진다 */
window.BUILD = '';
const SIZES = /*SIZES*/{"data.js": 1797059, "atlas/cover_s.webp": 780562}/*END*/;
window.PRELOAD = {};
window.BUILD = '?v=' + (SIZES['data.js'] || 0);
(() => {
  const boot = document.getElementById('boot'), pctEl = document.getElementById('bootPct'), mbEl = document.getElementById('bootMB');
  const bar = boot.querySelector('.bar i');
  const show = (done, total) => {
    const p = total ? Math.min(100, Math.floor(done / total * 100)) : 0;
    pctEl.textContent = p + '%'; bar.style.transform = `scaleX(${p / 100})`;
    mbEl.textContent = total ? `${(done / 1e6).toFixed(1)} / ${(total / 1e6).toFixed(1)} MB` : '';
  };
  const runMain = () => { const sc = document.createElement('script'); sc.textContent = document.getElementById('main').textContent; document.body.appendChild(sc); };
  const finish = () => requestAnimationFrame(() => requestAnimationFrame(() => { boot.classList.add('done'); setTimeout(() => boot.remove(), 700); }));
  addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.code === 'KeyR') sessionStorage.setItem('hardReload', '1'); });

  if (location.protocol.startsWith('http')) {
    boot.classList.add('on');
    const files = ['data.js', 'atlas/cover_s.webp'], got = {};
    const total = files.reduce((a, f) => a + (SIZES[f] || 0), 0);
    const tick = () => show(Object.values(got).reduce((a, b) => a + b, 0), total);
    const pull = async f => {
      const r = await fetch(f + BUILD); const rd = r.body.getReader(), parts = [];
      got[f] = 0;
      for (;;) { const { done, value } = await rd.read(); if (done) break; parts.push(value); got[f] += value.length; tick(); }
      return new Blob(parts, { type: r.headers.get('content-type') || '' });
    };
    Promise.all(files.map(pull)).then(async ([data, cover]) => {
      window.PRELOAD.cover_s = URL.createObjectURL(cover);
      const sc = document.createElement('script'); sc.textContent = await data.text(); document.body.appendChild(sc);
      show(total, total); runMain(); finish();
    }).catch(() => {   // 받는 중 실패하면 예전 방식으로
      const sc = document.createElement('script'); sc.src = 'data.js' + BUILD; sc.onload = () => { runMain(); finish(); }; document.body.appendChild(sc);
    });
  } else {
    const fake = sessionStorage.getItem('hardReload'); sessionStorage.removeItem('hardReload');
    const sc = document.createElement('script'); sc.src = 'data.js' + BUILD;
    if (!fake) { boot.remove(); sc.onload = runMain; document.body.appendChild(sc); return; }
    boot.classList.add('on');
    const T = 1400, t0 = performance.now(), total = (SIZES['data.js'] || 1.6e6) + (SIZES['atlas/cover_s.webp'] || 0.8e6);
    const step = now => { const p = Math.min(1, (now - t0) / T), e = 1 - Math.pow(1 - p, 2); show(e * total, total); if (p < 1) requestAnimationFrame(step); else { runMain(); finish(); } };
    sc.onload = () => requestAnimationFrame(step); document.body.appendChild(sc);
  }
})();
</script>
<script type="text/plain" id="main">
const M = window.META, C = window.COVERS, N = C.length;
// 버전: 화면·동작이 바뀌면 올린다. 데이터 날짜는 build_web.py 가 META.built 에 적는다
const VERSION = '1.4.4';
document.getElementById('ver').textContent = `v${VERSION}`;
document.getElementById('ver').title = M.built ? `data ${M.built}` : '';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
/* 화면 구간 세 개: S(폰) ≤ 720 · M 721–1024 · L ≥ 1025. S 는 CSS 의 max-width: 720px 와 같은 기준.
   M 까지는 축을 드롭다운으로, L 은 가로 세그먼트(그래도 머리줄이 넘치면 드롭다운) */
const BP_S = 720, BP_M = 1024;
const narrow = () => innerWidth <= BP_S;
const NOHOVER = matchMedia('(hover: none)');
const OUT = 'cubic-bezier(.22,1,.36,1)';
const GAP = 0.18, ASPECT = 1288 / 1600;

/* 축 하나가 격자 배치와 세 폭 짝을 함께 정한다 */
const AXES = {
  spine:       { label: 'Spine',       name: 'Spine' },
  year:        { label: 'Year',        name: 'Release year' },
  country:     { label: 'Country',     name: 'Country' },
  runtime:     { label: 'Runtime',     name: 'Runtime' },
  aspect:      { label: 'Aspect',      name: 'Aspect ratio' },
  color:       { label: 'Color',       name: 'Color' },
  people:      { label: 'People',      name: 'People' },
  type:        { label: 'Type',        name: 'Typography' },
  composition: { label: 'Composition', name: 'Composition' },
  medium:      { label: 'Medium',      name: 'Medium' },
};
const KEYS = Object.keys(AXES);
const META_AXES = new Set(['spine', 'year']);
const TROPE_AXES = new Set(['people', 'type', 'composition', 'medium']);
const stem = f => f.replace(/\.jpg$/, '');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const has = (i, k) => META_AXES.has(k) || !!C[i].nb[k];
const ease = t => 1 - Math.pow(1 - t, 3);
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

let axis = 'spine', traceOn = false, cur = null, hist = [];

/* ---------- 공통: 선택 표시, 글자 전환 ---------- */
function movePill(group, instant = false) {
  let pill = group.querySelector('.pill');
  if (!pill) { pill = document.createElement('span'); pill.className = 'pill'; group.prepend(pill); instant = true; }
  const on = group.querySelector('button.on');
  if (!on) { pill.style.width = '0px'; return; }

/* 세 폭 보기 스와이프: 좌우 = 이전·다음, 위아래 = 아래·위 줄로(밀어 올리면 아래 줄이 온다). 정보 칸은 스크롤에 쓴다 */

/* ---------- 격자 키보드 이동: 방향키로 가장 가까운 이웃 타일, enter 로 연다 ---------- */
let kf = -1;
function gridStep(dir) {
  const L = G.layout(axis), ok = i => L.px[i] === L.px[i];
  const tw = i => L.tws ? L.tws[i] : L.tw;
  const cx = i => L.px[i] + tw(i) / 2, cy = i => L.py[i] + tw(i) / ASPECT / 2;

    let best = Infinity;

  } else {
    const [ux, uy] = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] }[dir];
    let best = Infinity;

      if (score < best) { best = score; next = i; }

cv.addEventListener('blur', gridBlur);

/* ---------- 단축키: e.code(물리 키)로 읽어 한/영 입력 상태와 무관하다 (KeyF = f, F, ㄹ) ---------- */

  else if (NAV_KEYS[c]) { e.preventDefault(); NAV_KEYS[c](); }
});

/* 0.2초 머무르면 단축키 팝오버. 대상 요소에 data-key(표시할 키), data-tip(영어 설명) */
const kbd = document.createElement('div');
kbd.id = 'kbd'; document.body.appendChild(kbd);
let kbdTimer = 0, kbdEl = null;
function hideKbd() { clearTimeout(kbdTimer); kbd.classList.remove('show'); kbdEl = null; }
function showKbd(el) {
  kbd.innerHTML = `${el.dataset.tip ? `<span>${esc(el.dataset.tip)}</span>` : ''}${el.dataset.key.split(' ').map(k => `<kbd>${esc(k)}</kbd>`).join('')}`;
  kbd.classList.add('show');
  const r = el.getBoundingClientRect(), w = kbd.offsetWidth, h = kbd.offsetHeight;
  let x = r.left + r.width / 2 - w / 2, y = r.bottom + 8;
  if (y + h > innerHeight - 8) y = r.top - h - 8;
  if (r.height > 200) y = r.top + 12;                 // 큰 패널은 위쪽 안에
  kbd.style.left = Math.max(8, Math.min(innerWidth - w - 8, x)) + 'px';
  kbd.style.top = Math.max(8, y) + 'px';
}
document.addEventListener('mouseover', e => {
  if (NOHOVER.matches || fromTouch()) return;
  const el = e.target.closest?.('[data-key]');
  if (el === kbdEl) return;
  hideKbd();
  if (!el) return;
  kbdEl = el;
  kbdTimer = setTimeout(() => { if (kbdEl === el) showKbd(el); }, 200);
});
document.addEventListener('mousedown', hideKbd);

/* ---------- 검색 ---------- */
const fold = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const HAY = C.map(c => fold([c.title, c.directors, c.countries, c.year, (c.objs || []).join(' ')].join(' ')));
const qEl = document.getElementById('q'), searchEl = document.getElementById('search'), resEl = document.getElementById('results');
let hits = [], hitOn = 0;
function runSearch() {
  const q = fold(qEl.value).trim();
  searchEl.classList.toggle('has', !!q);
  if (!q) { hits = []; G.highlight(null); renderResults(); setCount(); return; }
  const toks = q.split(/\s+/);
  const scored = [];
  C.forEach((c, i) => {
    const t = fold(c.title), h = HAY[i];
    let ok = true, score = 0;
    for (const w of toks) {
      const num = w.replace(/^#/, '');
      if (/^\d+$/.test(num) && (+num === c.spine)) { score += 100; continue; }
      if (/^\d{4}$/.test(w) && +w === c.year) { score += 40; continue; }
      if (w.startsWith('#')) { ok = false; break; }
      if (t.startsWith(w)) score += 60;
      else if (t.includes(' ' + w)) score += 45;
      else if (t.includes(w)) score += 30;
      else if (h.includes(w)) score += 10;
      else { ok = false; break; }
    }
    if (ok) scored.push([score, i]);
  });
  scored.sort((a, b) => b[0] - a[0] || C[a[1]].spine - C[b[1]].spine);
  hits = scored.map(x => x[1]); hitOn = 0;
  G.highlight(new Set(hits));
  renderResults(); setCount();
}
function setCount() {
  // 밝게 남은 커버 / 전체 편수. 평소엔 확보한 커버 전부, 검색 중엔 맞는 것
  document.getElementById('count').textContent = `${qEl.value.trim() ? hits.length : M.count} / ${M.films}`;
}
function renderResults() {
  const q = qEl.value.trim();
  searchEl.classList.toggle('open', !!q && document.activeElement === qEl);
  if (!q) { resEl.innerHTML = ''; return; }
  if (!hits.length) { resEl.innerHTML = '<li class="none">No results</li>'; return; }
  resEl.innerHTML = hits.slice(0, 8).map((i, n) => { const c = C[i]; return `<li role="option" data-i="${i}" class="${n === hitOn ? 'on' : ''}">
    <img class="lq" style="${lq(i)}" src="thumbs/${encodeURIComponent(c.file)}" alt=""><div><div class="t">${esc(c.title)}</div><div class="s">#${c.spine} · ${c.year} · ${esc(c.directors)}</div></div></li>`; }).join('');
}
function pickResult(i) {
  if (i === undefined) return;
  qEl.blur(); searchEl.classList.remove('open');
  if (cur !== null) { openTri(i, true, null); return; }
  if (!G.visible(i)) { const k = KEYS.find(k => k !== axis && has(i, k) && (META_AXES.has(k) || C[i].g[k])); if (k) setAxis(k); }
  const from = lensOn === i && lensBox ? lensBox : G.rect(i);
  hideLens(); tip.classList.remove('show');
  openTri(i, true, from);
}
function previewResult(i) {
  if (cur !== null || i === undefined || !G.visible(i)) return;
  showLens(i);
}
qEl.addEventListener('input', runSearch);
document.getElementById('qClear').addEventListener('click', () => {
  if (qEl.value.trim()) { qEl.value = ''; runSearch(); qEl.focus(); }
  else { qEl.value = ''; runSearch(); qEl.blur(); }
});
document.getElementById('qClear').addEventListener('mousedown', e => e.preventDefault());
qEl.addEventListener('focus', () => { renderResults(); });
qEl.addEventListener('blur', () => setTimeout(() => { searchEl.classList.remove('open'); if (lensOn !== null && cur === null) hideLens(); }, 150));
qEl.addEventListener('keydown', e => {
  e.stopPropagation();
  const n = Math.min(8, hits.length);
  if (e.key === 'ArrowDown' && n) { e.preventDefault(); hitOn = (hitOn + 1) % n; renderResults(); previewResult(hits[hitOn]); }
  else if (e.key === 'ArrowUp' && n) { e.preventDefault(); hitOn = (hitOn - 1 + n) % n; renderResults(); previewResult(hits[hitOn]); }
  else if (e.key === 'Enter') { e.preventDefault(); pickResult(hits[hitOn]); }
  else if (e.key === 'Escape') { if (qEl.value) { qEl.value = ''; runSearch(); } else qEl.blur(); }
});
resEl.addEventListener('mousedown', e => e.preventDefault());   // 목록을 누를 때 입력창 포커스를 잃지 않게
resEl.addEventListener('click', e => { const li = e.target.closest('li[data-i]'); if (li) pickResult(+li.dataset.i); });
// 호버한 줄이 선택 줄이 된다(엔터·화살표도 거기서 이어진다)
resEl.addEventListener('mousemove', e => {
  const li = e.target.closest('li[data-i]'); if (!li) return;
  const n = [...resEl.children].indexOf(li);
  if (n !== hitOn) { hitOn = n; resEl.querySelectorAll('li').forEach((x, k) => x.classList.toggle('on', k === n)); }
  if (+li.dataset.i !== lensOn) previewResult(+li.dataset.i);
});

/* ---------- 주소: #<축>[,t][,tri=<spine>] ---------- */
/* 세 폭 보기를 열 때만 기록을 하나 쌓는다(pushState). 그 안의 이동·축 바꾸기는 그 기록을 고쳐 쓴다.
   닫기(×, esc)는 history.back() 으로 그 기록을 걷어 내고, 브라우저 뒤로 가기는 popstate 에서 닫는다 */
let pushed = false;
function syncHash() {
  const parts = [axis];
  if (traceOn) parts.push('t');
  if (cur !== null) parts.push(`tri=${C[cur].spine}`);
  const h = '#' + parts.join(',');
  if (cur !== null && !pushed) { history.pushState({ tri: true }, '', h); pushed = true; }
  else history.replaceState(history.state, '', h);
}
addEventListener('popstate', () => {
  const sp = +(location.hash.match(/tri=(\d+)/)?.[1] || 0);
  if (cur !== null && !sp) { pushed = false; closeTri(true); }
  else if (cur === null && sp) { const i = C.findIndex(c => c.spine === sp); if (i >= 0) { pushed = true; openTri(i); } }
  else if (cur === null) syncHash();   // 닫기로 돌아온 기록: 축·눈 상태를 지금 것으로
});
function start() {
  const parts = location.hash.slice(1).split(',');
  // 예전 주소(#map, #spine,tri=2:lines:t)도 받아 준다
  const old = parts.find(p => p.startsWith('tri='))?.slice(4).split(':') || [];
  axis = AXES[old[1]] ? old[1] : AXES[parts[0]] ? parts[0] : 'spine';
  G.size();
  G.go(axis, true, true);
  swapText(document.getElementById('gridName'), AXES[axis].name);
  syncAxisButtons(); movePill(axesEl, true);
  setTrace(parts.includes('t') || parts.includes('trace') || old[2] === 't');
  const i = old[0] ? C.findIndex(c => c.spine === +old[0]) : -1;
  if (i >= 0) { history.replaceState(null, '', '#' + [axis, ...(traceOn ? ['t'] : [])].join(',')); openTri(i); }
  G.prefetch();
}
let rz, wasNarrow = narrow();
addEventListener('resize', () => {
  clearTimeout(rz);
  rz = setTimeout(() => {
    G.size(); G.go(axis, false); movePill(axesEl, true); fitAxes();
    if (cur !== null) { if (narrow() !== wasNarrow) showTri({ kind: 'axis' }); else { triSize(); const info = panels.querySelector('.info'); if (info) fitInfo(info, C[cur]); } }
    wasNarrow = narrow();
  }, 60);
});
start();
fitAxes();
</script>
